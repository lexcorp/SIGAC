openapi: 3.1.0
info:
  title: SIGAC API
  version: 0.3.23
servers:
  - url: /api/v1
paths:
  /health:
    get:
      security: []
      responses:
        '200':
          description: API health
  /session:
    get:
      operationId: getSessionAuthorization
      responses:
        '200':
          description: Authorization projection for the authenticated actor
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionAuthorizationReadModel' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
  /ubicaciones:
    get:
      operationId: listUbicaciones
      responses:
        '200':
          description: Operational locations in the active tenant; an empty catalog returns an empty items array.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UbicacionesResponse' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
  /expedientes:
    get:
      operationId: searchExpedientesByNumero
      parameters:
        - in: query
          name: numero
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: Expediente matches in the active tenant; zero matches returns an empty items array.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteSearchResponse' }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
  /expedientes/{id}:
    get:
      operationId: getExpediente
      parameters:
        - $ref: '#/components/parameters/ExpedienteId'
      responses:
        '200':
          description: Operational Expediente Workspace read model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteReadModel' }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ExpedienteNotFound' }
  /expedientes/{id}/timeline:
    get:
      operationId: getExpedienteTimeline
      parameters:
        - $ref: '#/components/parameters/ExpedienteId'
        - in: query
          name: cursor
          required: false
          description: Opaque cursor returned by the preceding page.
          schema: { type: string }
        - in: query
          name: limit
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Cursor-paginated Expediente movement timeline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelinePage' }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ExpedienteNotFound' }
  /expedientes/{id}/audit:
    get:
      operationId: getExpedienteAudit
      parameters:
        - $ref: '#/components/parameters/ExpedienteId'
        - in: query
          name: cursor
          required: false
          description: Opaque cursor returned by the preceding audit page.
          schema: { type: string }
        - in: query
          name: limit
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Sanitized audit entries ordered by occurredAt and auditId descending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpedienteAuditPage' }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/ExpedienteNotFound' }
  /expedientes/{id}/dispatch:
    post:
      operationId: dispatchExpediente
      parameters:
        - $ref: '#/components/parameters/ExpedienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispatchExpedienteRequest' }
      responses:
        '204':
          description: Expediente dispatched successfully; no response body.
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ExpedienteNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /expedientes/{id}/accept-custody:
    post:
      operationId: acceptCustody
      parameters:
        - $ref: '#/components/parameters/ExpedienteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptCustodyRequest' }
      responses:
        '204':
          description: Custody accepted successfully; no response body.
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/ExpedienteNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /agenda-imports:
    post:
      operationId: importAgenda
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Agenda import processed successfully
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendaImportResponse' }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AgendaPermissionDenied' }
        '409': { $ref: '#/components/responses/IdempotencyKeyReused' }
        '413': { $ref: '#/components/responses/AgendaUploadTooLarge' }
        '415': { $ref: '#/components/responses/AgendaArtifactUnsupported' }
        '422': { $ref: '#/components/responses/AgendaLayoutRejected' }
        '500': { $ref: '#/components/responses/AgendaImportFailed' }
        '504': { $ref: '#/components/responses/AgendaImportTimeout' }
    get:
      operationId: listAgendaImports
      parameters:
        - in: query
          name: agendaDate
          required: false
          description: Filter by agenda date (YYYY-MM-DD).
          schema: { type: string, format: date }
        - in: query
          name: cursor
          required: false
          description: Opaque cursor returned by the preceding page.
          schema: { type: string }
        - in: query
          name: limit
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Cursor-paginated agenda import history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendaImportHistoryPage' }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AgendaPermissionDenied' }
  /agenda-imports/{importacionId}:
    get:
      operationId: getAgendaImportDetail
      parameters:
        - in: path
          name: importacionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Full detail of an agenda importación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendaImportDetail' }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AgendaPermissionDenied' }
        '404': { $ref: '#/components/responses/AgendaImportNotFound' }
  /agenda-imports/{importacionId}/incidents:
    get:
      operationId: getAgendaImportIncidents
      parameters:
        - in: path
          name: importacionId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: cursor
          required: false
          description: Opaque cursor returned by the preceding page.
          schema: { type: string }
        - in: query
          name: limit
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Cursor-paginated incidents for an agenda importación
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendaImportIncidentsPage' }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AgendaPermissionDenied' }
  /agendas/{date}:
    get:
      operationId: getAgendaDaySummary
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Day-level agenda summary read model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendaDayReadModel' }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AgendaPermissionDenied' }
        '404': { $ref: '#/components/responses/AgendaNotFound' }
  /agendas/{date}/preparation-items:
    get:
      operationId: getAgendaPreparationList
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [APPOINTMENT_TIME_ASC, PATIENT_NAME_ASC]
        - in: query
          name: cursor
          required: false
          description: Opaque cursor returned by the preceding page.
          schema: { type: string }
        - in: query
          name: limit
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Cursor-paginated agenda preparation items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendaPreparationPage' }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AgendaPermissionDenied' }
  /agendas/{date}/preparation-items/print:
    get:
      operationId: printAgendaPreparationList
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date }
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [APPOINTMENT_TIME_ASC, PATIENT_NAME_ASC]
      responses:
        '200':
          description: Full (non-paginated) preparation list for print
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgendaPreparationPrintResponse' }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AgendaPermissionDenied' }
  /agendas/{date}/preparation-report:
    post:
      operationId: generatePreparationReport
      summary: Genera y descarga el PDF de lista de preparación para Archivo Clínico
      description: |
        Genera un PDF operativo agrupado por servicio y médico, listo para imprimir.
        El PDF se genera en memoria y se descarga directamente (sin persistencia).
        Requiere AGENDA_VIEW + AGENDA_PRINT.
        La fecha y el tenant se obtienen del contexto de autorización; nunca del body.
        Ref: preparation-reports spec REQ-PR-002, ADR-0030, ADR-0031.
      parameters:
        - in: path
          name: date
          required: true
          schema: { type: string, format: date, example: "2026-08-26" }
        - in: query
          name: order
          required: false
          description: Ordenamiento de citas. Default APPOINTMENT_TIME_ASC.
          schema:
            type: string
            enum: [APPOINTMENT_TIME_ASC, PATIENT_NAME_ASC]
        - in: query
          name: services
          required: false
          description: |
            Lista de códigos de servicio separados por coma, ej. "CL05,CL06".
            Omitir o dejar vacío para incluir todos los servicios.
          schema: { type: string }
      responses:
        '200':
          description: PDF generado correctamente, descarga directa
          headers:
            Content-Disposition:
              description: attachment; filename="lista-preparacion-{date}.pdf"
              schema: { type: string }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/HttpValidationError' }
        '401': { $ref: '#/components/responses/AuthenticationRequired' }
        '403': { $ref: '#/components/responses/AgendaPermissionDenied' }
        '422': { $ref: '#/components/responses/NoActiveAppointments' }
        '500': { $ref: '#/components/responses/AgendaImportFailed' }
components:
  parameters:
    ExpedienteId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Permission:
      type: string
      enum: [REQUEST_CREATE, REQUEST_ASSIGN, SEARCH_START, SEARCH_MARK_LOCATED, SEARCH_MARK_NOT_LOCATED, PREPARATION_MARK_READY, CUSTODY_TRANSFER, EXPEDIENT_DISPATCH, CUSTODY_ACCEPT, LOAN_OPEN, LOAN_RENEW, RETURN_RECEIVE, REARCHIVE_CONFIRM, INCIDENT_OPEN, INCIDENT_RESOLVE, EXPEDIENT_VIEW, EXPEDIENT_AUDIT_VIEW, LOCATION_VIEW, REPORT_VIEW, ADMIN_CONFIGURE, AGENDA_IMPORT, AGENDA_VIEW, AGENDA_INCIDENT_VIEW, AGENDA_PRINT]
    SessionAuthorizationReadModel:
      type: object
      additionalProperties: false
      required: [actorId, permissions]
      properties:
        actorId: { type: string }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    DecimalBigint:
      type: string
      pattern: '^[0-9]+$'
      example: '42'
    EstadoOperativo:
      type: string
      enum: [DISPONIBLE, APARTADO, EN_TRASLADO, EN_CONSULTA, NO_LOCALIZADO, EXTRAVIADO]
    Ubicacion:
      type: object
      additionalProperties: false
      required: [id, codigo, descripcion]
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        descripcion: { type: string }
    UbicacionOption:
      type: object
      additionalProperties: false
      required: [id, codigo, descripcion]
      properties:
        id: { type: string, format: uuid }
        codigo: { type: string }
        descripcion: { type: string }
    UbicacionesResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UbicacionOption' }
    ExpedienteSearchPaciente:
      type: object
      additionalProperties: false
      required: [idInstitucional, curp, nombreOperativo, numeroIssste]
      properties:
        idInstitucional: { type: string }
        curp: { type: string }
        nombreOperativo: { type: string }
        numeroIssste: { type: string }
    ExpedienteSearchItem:
      type: object
      additionalProperties: false
      required: [expedienteId, expedienteNumero, paciente, estadoOperativo, ubicacion]
      properties:
        expedienteId: { type: string, format: uuid }
        expedienteNumero: { type: string }
        paciente: { $ref: '#/components/schemas/ExpedienteSearchPaciente' }
        estadoOperativo: { $ref: '#/components/schemas/EstadoOperativo' }
        ubicacion:
          oneOf:
            - { $ref: '#/components/schemas/Ubicacion' }
            - { type: 'null' }
    ExpedienteSearchResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExpedienteSearchItem' }
    PacienteReferenciaSummary:
      type: object
      additionalProperties: false
      required: [id, displayLabel]
      properties:
        id: { type: string }
        displayLabel: { type: string }
    CustodiaActual:
      type: object
      additionalProperties: false
      required: [custodioTipo, custodioRef, servicio, aceptadaEn]
      properties:
        custodioTipo: { type: string }
        custodioRef: { type: string }
        servicio: { type: [string, 'null'] }
        aceptadaEn: { type: [string, 'null'], format: date-time }
    ActiveRequestSummary:
      type: object
      additionalProperties: false
      required: [solicitudId, tipo, origen, estado, asignadoA]
      properties:
        solicitudId: { type: string }
        tipo: { type: string }
        origen: { type: string }
        estado:
          type: string
          enum: [Pendiente, Asignada, EnBusqueda, Localizada, Preparada, Entregada, Cancelada, NoLocalizada]
        asignadoA: { type: [string, 'null'] }
    ActiveLoanSummary:
      type: object
      additionalProperties: false
      required: [prestamoId, finalidad, custodioRef, destinoTipo, destinoRef, dueAt, fuenteHabilitanteSalida, estado]
      properties:
        prestamoId: { type: string }
        finalidad: { type: string }
        custodioRef: { type: string }
        destinoTipo: { type: string }
        destinoRef: { type: string }
        dueAt: { type: string, format: date-time }
        fuenteHabilitanteSalida:
          type: string
          enum: [CONSULTA_PROGRAMADA, VALE_ARCHIVO_SM_1_14, ORDEN_SUPERIOR]
        estado: { type: string, enum: [Activo, Vencido] }
    OpenIncidentSummary:
      type: object
      additionalProperties: false
      required: [incidenciaId, tipo, severidad, estado, resumen, asignadoA, openedAt]
      properties:
        incidenciaId: { type: string }
        tipo: { type: string }
        severidad: { type: string }
        estado: { type: string, enum: [Abierta, EnInvestigacion, Escalada] }
        resumen: { type: string }
        asignadoA: { type: [string, 'null'] }
        openedAt: { type: string, format: date-time }
    ExpedienteCapability:
      type: string
      enum:
        - SOLICITAR
        - INICIAR_BUSQUEDA
        - MARCAR_LOCALIZADO
        - MARCAR_NO_LOCALIZADO
        - DISPATCH
        - ACCEPT_CUSTODY
        - ABRIR_PRESTAMO
        - RENOVAR_PRESTAMO
        - RECIBIR_DEVOLUCION
        - CONFIRMAR_REARCHIVO
        - REPORTAR_INCIDENCIA
    ExpedienteReadModel:
      type: object
      additionalProperties: false
      required: [id, expedienteNumero, pacienteRef, estadoOperativo, ubicacionActual, custodiaActual, prestamoActivo, solicitudActiva, incidenciasAbiertas, capabilities, rowVersion]
      properties:
        id: { type: string, format: uuid }
        expedienteNumero: { type: string }
        pacienteRef: { $ref: '#/components/schemas/PacienteReferenciaSummary' }
        estadoOperativo: { $ref: '#/components/schemas/EstadoOperativo' }
        ubicacionActual:
          oneOf:
            - { $ref: '#/components/schemas/Ubicacion' }
            - { type: 'null' }
        custodiaActual:
          oneOf:
            - { $ref: '#/components/schemas/CustodiaActual' }
            - { type: 'null' }
        prestamoActivo:
          oneOf:
            - { $ref: '#/components/schemas/ActiveLoanSummary' }
            - { type: 'null' }
        solicitudActiva:
          oneOf:
            - { $ref: '#/components/schemas/ActiveRequestSummary' }
            - { type: 'null' }
        incidenciasAbiertas:
          type: array
          items: { $ref: '#/components/schemas/OpenIncidentSummary' }
        capabilities:
          type: array
          items: { $ref: '#/components/schemas/ExpedienteCapability' }
        rowVersion: { $ref: '#/components/schemas/DecimalBigint' }
    MovimientoExpedienteSummary:
      type: object
      additionalProperties: false
      required: [movimientoId, movementType, originLocation, destinationLocation, originCustodianRef, destinationCustodianRef, businessReferenceType, businessReferenceId, occurredAt, recordedAt, actorRef, source, correlationId]
      properties:
        movimientoId: { type: string }
        movementType: { type: string }
        originLocation: { type: [string, 'null'] }
        destinationLocation: { type: [string, 'null'] }
        originCustodianRef: { type: [string, 'null'] }
        destinationCustodianRef: { type: [string, 'null'] }
        businessReferenceType: { type: string }
        businessReferenceId: { type: [string, 'null'] }
        occurredAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        actorRef: { type: string }
        source: { type: string }
        correlationId: { type: [string, 'null'] }
    TimelinePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MovimientoExpedienteSummary' }
        nextCursor: { type: [string, 'null'] }
    ExpedienteAuditEntrySummary:
      type: object
      additionalProperties: false
      required: [auditId, action, result, actorRef, occurredAt, source, requestId, correlationId]
      properties:
        auditId: { type: string, format: uuid }
        action: { type: string }
        result: { type: string, enum: [success, denied, not-found, conflict, invalid-transition] }
        actorRef: { type: string }
        occurredAt: { type: string, format: date-time }
        source: { type: string, enum: [WEB, INTERNAL] }
        requestId: { type: string }
        correlationId: { type: string }
    ExpedienteAuditPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExpedienteAuditEntrySummary' }
        nextCursor: { type: [string, 'null'] }
    BusinessReference:
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string }
        id: { type: [string, 'null'] }
    IntendedCustodian:
      type: object
      additionalProperties: false
      required: [type, reference]
      properties:
        type: { type: string }
        reference: { type: string }
    CustodyReceptor:
      type: object
      additionalProperties: false
      required: [type, reference, service]
      properties:
        type: { type: string }
        reference: { type: string }
        service: { type: [string, 'null'] }
    DispatchExpedienteRequest:
      type: object
      additionalProperties: false
      required: [destination, intendedCustodian, businessReference, expectedRowVersion]
      properties:
        destination: { $ref: '#/components/schemas/Ubicacion' }
        intendedCustodian: { $ref: '#/components/schemas/IntendedCustodian' }
        businessReference: { $ref: '#/components/schemas/BusinessReference' }
        expectedRowVersion: { $ref: '#/components/schemas/DecimalBigint' }
    AcceptCustodyRequest:
      type: object
      additionalProperties: false
      required: [receptor, ubicacionDestino, businessReference, expectedRowVersion]
      properties:
        receptor: { $ref: '#/components/schemas/CustodyReceptor' }
        ubicacionDestino: { $ref: '#/components/schemas/Ubicacion' }
        businessReference: { $ref: '#/components/schemas/BusinessReference' }
        expectedRowVersion: { $ref: '#/components/schemas/DecimalBigint' }
    HttpFieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field: { type: string }
        code: { type: string, enum: [REQUIRED, INVALID_FORMAT, INVALID_TYPE, OUT_OF_RANGE] }
    ProblemDetails:
      type: object
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum: [HTTP_VALIDATION_ERROR, AUTHENTICATION_REQUIRED, PERMISSION_DENIED, INSUFFICIENT_ENABLING_SOURCE, EXPEDIENTE_NOT_FOUND, OPTIMISTIC_LOCK_CONFLICT, REQUEST_INVALID_TRANSITION, AGENDA_IMPORT_NOT_FOUND, AGENDA_NOT_FOUND, IDEMPOTENCY_KEY_REUSED, AGENDA_UPLOAD_TOO_LARGE, AGENDA_ARTIFACT_UNSUPPORTED, AGENDA_LAYOUT_REJECTED, AGENDA_IMPORT_FAILED, AGENDA_IMPORT_TIMEOUT]
        detail: { type: string }
        errors:
          type: array
          items: { $ref: '#/components/schemas/HttpFieldError' }
    AgendaImportMetrics:
      type: object
      additionalProperties: false
      required: [receivedRecords, processed, added, updated, unchanged, restored, pendingReview, rejected, duplicateFolio, withdrawnFromAgenda, incidents, errors]
      properties:
        receivedRecords: { type: integer, minimum: 0 }
        processed: { type: integer, minimum: 0 }
        added: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
        restored: { type: integer, minimum: 0 }
        pendingReview: { type: integer, minimum: 0 }
        rejected: { type: integer, minimum: 0 }
        duplicateFolio: { type: integer, minimum: 0 }
        withdrawnFromAgenda: { type: integer, minimum: 0 }
        incidents: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
    AgendaImportSummary:
      type: object
      additionalProperties: false
      required: [importacionId, agendaDate, importedAt, outcome, metrics]
      properties:
        importacionId: { type: string, format: uuid }
        agendaDate: { type: string, format: date }
        importedAt: { type: string, format: date-time }
        outcome:
          type: string
          enum: [IMPORTED, ALREADY_IMPORTED, RECONCILED]
        metrics: { $ref: '#/components/schemas/AgendaImportMetrics' }
    AgendaImportResponse:
      type: object
      additionalProperties: false
      required: [importacionId, agendaDate, importedAt, outcome, metrics]
      properties:
        importacionId: { type: string, format: uuid }
        agendaDate: { type: string, format: date }
        importedAt: { type: string, format: date-time }
        outcome:
          type: string
          enum: [IMPORTED, ALREADY_IMPORTED, RECONCILED]
        metrics: { $ref: '#/components/schemas/AgendaImportMetrics' }
    AgendaImportHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgendaImportSummary' }
        nextCursor: { type: [string, 'null'] }
    RegistroImportadoResult:
      type: object
      additionalProperties: false
      required: [registroId, sourcePosition, folio, processingResult, incidentCodes]
      properties:
        registroId: { type: string, format: uuid }
        sourcePosition: { type: integer, minimum: 1 }
        folio: { type: [string, 'null'] }
        processingResult:
          type: string
          enum: [ADDED, UPDATED, UNCHANGED, RESTORED, PENDING_REVIEW, REJECTED, DUPLICATE_FOLIO]
        incidentCodes:
          type: array
          items:
            type: string
            enum: [PHYSICIAN_NOT_RESOLVED, PHYSICIAN_AMBIGUOUS, SERVICE_NOT_RESOLVED, EXPEDIENT_NOT_RESOLVED, REQUIRED_DATA_MISSING, ROW_INCONSISTENT, DUPLICATE_FOLIO_IN_SNAPSHOT]
    AgendaImportDetail:
      type: object
      additionalProperties: false
      required: [summary, registros]
      properties:
        summary: { $ref: '#/components/schemas/AgendaImportSummary' }
        registros:
          type: array
          items: { $ref: '#/components/schemas/RegistroImportadoResult' }
    AgendaImportIncidentSummary:
      type: object
      additionalProperties: false
      required: [incidenciaId, registroId, sourcePosition, type]
      properties:
        incidenciaId: { type: string, format: uuid }
        registroId: { type: string, format: uuid }
        sourcePosition: { type: integer, minimum: 1 }
        type:
          type: string
          enum: [PHYSICIAN_NOT_RESOLVED, PHYSICIAN_AMBIGUOUS, SERVICE_NOT_RESOLVED, EXPEDIENT_NOT_RESOLVED, REQUIRED_DATA_MISSING, ROW_INCONSISTENT, DUPLICATE_FOLIO_IN_SNAPSHOT]
    AgendaImportIncidentsPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgendaImportIncidentSummary' }
        nextCursor: { type: [string, 'null'] }
    AgendaDayReadModel:
      type: object
      additionalProperties: false
      required: [agendaDate, latestImportacionId, latestImportedAt, latestOutcome, activeAppointments, physicians, services, incidentCount]
      properties:
        agendaDate: { type: string, format: date }
        latestImportacionId: { type: string, format: uuid }
        latestImportedAt: { type: string, format: date-time }
        latestOutcome:
          type: string
          enum: [IMPORTED, ALREADY_IMPORTED, RECONCILED]
        activeAppointments: { type: integer, minimum: 0 }
        physicians: { type: integer, minimum: 0 }
        services: { type: integer, minimum: 0 }
        incidentCount: { type: integer, minimum: 0 }
    AgendaMedicoRef:
      type: object
      additionalProperties: false
      required: [numeroEmpleado, nombre]
      properties:
        numeroEmpleado: { type: string }
        nombre: { type: string }
    AgendaServicioRef:
      type: object
      additionalProperties: false
      required: [codigo, nombre]
      properties:
        codigo: { type: string }
        nombre: { type: string }
    AgendaExpedienteRef:
      type: object
      additionalProperties: false
      required: [original, reference]
      properties:
        original: { type: string }
        reference: { type: [string, 'null'] }
    AgendaPreparationItem:
      type: object
      additionalProperties: false
      required: [folio, nombrePaciente, expediente, tipoDerechohabiente, tipoConsulta, agendaDate, appointmentTime, medico, servicioEspecialidad]
      properties:
        folio: { type: string }
        nombrePaciente: { type: string }
        expediente: { $ref: '#/components/schemas/AgendaExpedienteRef' }
        tipoDerechohabiente: { type: string }
        tipoConsulta: { type: string, enum: [FIRST_TIME, SUBSEQUENT] }
        agendaDate: { type: string, format: date }
        appointmentTime: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        medico: { $ref: '#/components/schemas/AgendaMedicoRef' }
        servicioEspecialidad: { $ref: '#/components/schemas/AgendaServicioRef' }
    AgendaPreparationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgendaPreparationItem' }
        nextCursor: { type: [string, 'null'] }
    AgendaPreparationPrintResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AgendaPreparationItem' }
  responses:
    HttpValidationError:
      description: Structurally invalid or malformed request
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                required: [detail]
                properties:
                  status: { const: 400 }
                  code: { const: HTTP_VALIDATION_ERROR }
    AuthenticationRequired:
      description: Authentication is required
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 401 }
                  code: { const: AUTHENTICATION_REQUIRED }
    PermissionDenied:
      description: Authenticated actor lacks EXPEDIENT_VIEW
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 403 }
                  code: { const: PERMISSION_DENIED }
    Forbidden:
      description: Authenticated actor lacks permission or an enabling source
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 403 }
                  code: { enum: [PERMISSION_DENIED, INSUFFICIENT_ENABLING_SOURCE] }
    ExpedienteNotFound:
      description: Expediente is not visible in the active tenant
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 404 }
                  code: { const: EXPEDIENTE_NOT_FOUND }
    Conflict:
      description: Optimistic lock conflict or invalid business transition
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 409 }
                  code: { enum: [OPTIMISTIC_LOCK_CONFLICT, REQUEST_INVALID_TRANSITION] }
    AgendaPermissionDenied:
      description: Authenticated actor lacks AGENDA_IMPORT or AGENDA_VIEW
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 403 }
                  code: { const: PERMISSION_DENIED }
    AgendaImportNotFound:
      description: Agenda importación not found in active tenant
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 404 }
                  code: { const: AGENDA_IMPORT_NOT_FOUND }
    AgendaNotFound:
      description: Agenda not found for this date in active tenant
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 404 }
                  code: { const: AGENDA_NOT_FOUND }
    IdempotencyKeyReused:
      description: Idempotency-Key already used with a different artifact
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 409 }
                  code: { const: IDEMPOTENCY_KEY_REUSED }
    AgendaUploadTooLarge:
      description: Uploaded file exceeds the configured limit
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 413 }
                  code: { const: AGENDA_UPLOAD_TOO_LARGE }
    AgendaArtifactUnsupported:
      description: Artifact format or extension is not supported
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 415 }
                  code: { const: AGENDA_ARTIFACT_UNSUPPORTED }
    AgendaLayoutRejected:
      description: File content does not match the recognized SIMEF HTML layout
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 422 }
                  code: { const: AGENDA_LAYOUT_REJECTED }
    AgendaImportFailed:
      description: Unexpected technical failure; rollback performed
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 500 }
                  code: { const: AGENDA_IMPORT_FAILED }
    AgendaImportTimeout:
      description: Import processing timed out; rollback performed
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 504 }
                  code: { const: AGENDA_IMPORT_TIMEOUT }
    NoActiveAppointments:
      description: No hay citas activas para los servicios solicitados en esta fecha
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/ProblemDetails' }
              - type: object
                properties:
                  status: { const: 422 }
                  code: { const: NO_ACTIVE_APPOINTMENTS }
