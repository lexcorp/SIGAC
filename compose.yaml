services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sigac
      POSTGRES_PASSWORD: sigac_dev_only
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - sigac_pg:/var/lib/postgresql/data
      - ./tooling/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigac -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev_only
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  sigac_pg:
